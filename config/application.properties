# ===============================
# Spring
# ===============================
spring.application.name=parfait-report
server.port=8080

# ===============================
# Oracle DB
# ===============================
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@parfaitReport_high?TNS_ADMIN=/opt/oracle/wallet
spring.datasource.username=admin
spring.datasource.password=parfaitReport1102

# ===============================
# HikariCP
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ===============================
# MyBatis (있다면)
# ===============================
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ===============================
# Logging (중요 🔥)
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.jdbc.sqlonly=DEBUG
logging.level.jdbc.resultset=DEBUG

