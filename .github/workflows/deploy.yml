name: Parfait Full Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Node 세팅
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 백엔드 빌드
      - name: Build Backend
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew clean build -x test

      # 프론트 빌드
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # 백엔드 jar 서버 전송 (경로 구조 제거)
      - name: Copy Backend Jar to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/build/libs/parfaitReport-0.0.1-SNAPSHOT.jar"
          target: "/var/www/parfait_report/app"
          strip_components: 3
          overwrite: true

      # jar 이름 변경 + 재시작
      - name: Rename Jar and Restart Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/parfait_report/app
            mv -f parfaitReport-0.0.1-SNAPSHOT.jar parfait.jar
            sudo systemctl restart parfait

      # 프론트 기존 dist 삭제
      - name: Clean Old Frontend Dist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            rm -rf /var/www/parfait_report/frontend/dist

      # 프론트 dist 업로드
      - name: Copy Frontend Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/parfait_report/frontend/dist"
          overwrite: true
